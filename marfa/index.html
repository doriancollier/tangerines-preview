<style>
  /* One screen, one action. Desktop: plate left, the ask right. Phone: plate, then the ask, form on the first screen. */
  body { min-height: 100svh; display: flex; flex-direction: column; }
  .m-top { display: flex; justify-content: center; padding: var(--s5) var(--gutter) 0; color: var(--text); }
  .m-top svg { height: 30px; width: auto; display: block; }
  .m-main { flex: 1; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--s8); align-items: center; max-width: var(--page-max); width: 100%; margin: 0 auto; padding: var(--s6) var(--gutter) var(--s7); }
  .m-plate { margin: 0; }
  .m-plate .tg-plate { aspect-ratio: 4 / 3; background: #3C3D40; }
  .m-plate img { object-position: 50% 28%; }
  .m-ask .tg-h1 { font-size: clamp(40px, 5.4vw, 72px); margin-top: var(--s4); }
  .m-ask .tg-lede { margin-top: var(--s4); font-size: 19px; }
  .m-note { display: inline-flex; align-items: center; gap: 10px; margin: var(--s7) 0 var(--s3); font: 500 15px/1.3 var(--font-body); color: var(--text); }
  .m-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--t-tangerine); flex: none; }
  .m-ask .tg-small { margin-top: var(--s3); max-width: 460px; text-wrap: pretty; }
  .m-abx { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font: 400 var(--fs-small)/1 var(--font-body); text-decoration: none; }
  .m-abx svg { height: 20px; width: auto; display: block; }
  .m-foot { display: flex; justify-content: center; align-items: center; gap: var(--s4); flex-wrap: wrap; text-align: center; padding: var(--s5) var(--gutter) calc(var(--s5) + env(safe-area-inset-bottom)); }

  /* The waitlist form slot. The Kit embed goes inside #waitlist; these rules give
     Kit's input and button the brand look (pill input, ink button). */
  .m-slot { max-width: 460px; }
  .m-slot-empty { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: var(--r-control); background: var(--surface); color: var(--text-muted); font-size: var(--fs-small); font-style: italic; }
  #waitlist .formkit-form { max-width: none !important; margin: 0 !important; padding: 0 !important; background: none !important; border: 0 !important; box-shadow: none !important; }
  #waitlist .formkit-fields { display: flex; gap: var(--s2); margin: 0 !important; }
  #waitlist .formkit-field { flex: 1; min-width: 0; margin: 0 !important; }
  #waitlist .formkit-input { width: 100%; min-height: 48px; padding: 0 20px !important; border: 0 !important; border-radius: var(--r-control) !important; background: var(--surface) !important; color: var(--text) !important; font: 400 16px/1 var(--font-body) !important; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--text) 14%, transparent); }
  #waitlist .formkit-input::placeholder { color: var(--text-muted) !important; }
  #waitlist .formkit-input:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--focus); }
  #waitlist .formkit-submit { flex: none; min-height: 48px; margin: 0 !important; padding: 0 26px !important; border: 0 !important; border-radius: var(--r-control) !important; background: var(--btn-bg) !important; color: var(--btn-text) !important; font: 500 16px/1 var(--font-body) !important; cursor: pointer; }
  #waitlist .formkit-submit > span { padding: 0 !important; }
  #waitlist .formkit-powered-by-convertkit-container { display: none !important; }

  @media (max-width: 900px) {
    .m-top { padding-top: var(--s4); }
    .m-top svg { height: 26px; }
    .m-main { grid-template-columns: minmax(0, 1fr); gap: var(--s5); padding-top: var(--s4); align-items: start; }
    /* QR visitors are on phones: keep the top of the form on the first screen. */
    .m-plate .tg-plate { aspect-ratio: auto; height: 34svh; border-radius: 22px; }
    .m-ask .tg-h1 { font-size: 40px; margin-top: var(--s3); }
    .m-ask .tg-lede { font-size: 17px; margin-top: var(--s3); }
    .m-note { margin-top: var(--s5); }
    .m-slot { max-width: none; }
    #waitlist .formkit-fields { flex-direction: column; }
  }
  /* Short phones (iPhone SE and smaller): keep the button on the first screen. */
  @media (max-width: 900px) and (max-height: 700px) {
    .m-top { padding-top: var(--s3); }
    .m-plate .tg-plate { height: 26svh; }
    .m-ask .tg-h1 { font-size: 34px; }
    .m-ask .tg-lede { font-size: 16px; }
    .m-note { margin-top: var(--s4); font-size: 14px; }

      var inputs = document.querySelectorAll('#waitlist input[name="src"], #waitlist input[name="fields[src]"]');
      inputs.forEach(function (el) { el.value = src; });
      return inputs.length > 0;
    }
    if (!fill()) {
      var tries = 0;
      var t = setInterval(function () { if (fill() || ++tries > 40) clearInterval(t); }, 250);
    }
  })();
</script>

</body>
